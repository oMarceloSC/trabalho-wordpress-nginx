
services:
  mysql:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - wordpress_network
    restart: unless-stopped

  wordpress1:
    image: wordpress:5.4.2-php7.2-apache
    environment: &wordpress_environment
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - ./wordpress:/var/www/html
    depends_on:
      - mysql
    networks:
      - wordpress_network
    restart: unless-stopped

  wordpress2:
    image: wordpress:5.4.2-php7.2-apache
    environment: *wordpress_environment
    volumes:
      - ./wordpress:/var/www/html
    depends_on:
      - mysql
    networks:
      - wordpress_network
    restart: unless-stopped

  wordpress3:
    image: wordpress:5.4.2-php7.2-apache
    environment: *wordpress_environment
    volumes:
      - ./wordpress:/var/www/html
    depends_on:
      - mysql
    networks:
      - wordpress_network
    restart: unless-stopped

  nginx:
    image: nginx:1.19.0
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./wordpress:/usr/share/nginx/html:ro
    depends_on:
      - wordpress1
      - wordpress2
      - wordpress3
    networks:
      - wordpress_network
    restart: unless-stopped

  locust:
    image: locustio/locust:2.31.8
    ports:
      - "8089:8089"
    volumes:
      - ./locust:/mnt/locust:ro
    command: -f /mnt/locust/locustfile.py --host=http://nginx
    depends_on:
      - nginx
    networks:
      - wordpress_network

volumes:
  mysql_data:

networks:
  wordpress_network:
    driver: bridge
